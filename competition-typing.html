<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Competition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assests/css/all.min.css">
	<link rel="stylesheet" href="competition-typing/style_competition.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
</style>
</head>
<body>
    <noscript>
        <div style="text-align: center; padding: 1rem; background: #f472b6; color: #fff;">
            JavaScript is disabled. Please enable it to use all features of Typing Coach AI.
        </div>
    </noscript>
    <a href="#main" class="skip-link">Skip to Content</a>
    <header>
        <div class="logo">Typing Coach AI</div>
        <button class="hamburger" aria-label="Toggle navigation" onclick="toggleNav()">☰</button>
        <nav id="nav-menu">
            <a href="home.html" aria-label="Go to Home">Home</a>
        </nav>
    </header>

    <main id="main">
        <h1>Typing Coach AI - Competition</h1><br>
        <canvas id="particle-bg"></canvas>
    <div class="game-container">
        
        <div class="difficulty-selector">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty" onchange="setDifficulty(this.value)">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <div class="paragraph-frame">
            <p id="paragraph">Loading paragraph...</p>
            <div id="countdown" class="countdown"></div>
        </div>
        <div class="race-track">
            <div class="track-lane"></div>
            <div class="track-lane"></div>
            <div class="car" id="user1-car">
                <svg viewBox="0 0 100 50">
                    <rect x="10" y="20" width="80" height="20" fill="#ff4d4d" rx="5"/>
                    <circle cx="25" cy="40" r="8" fill="#111827"/>
                    <circle cx="75" cy="40" r="8" fill="#111827"/>
                    <rect x="30" y="10" width="40" height="10" fill="#ff9999" rx="3"/>
                    <path d="M90 30 l10 5 l-10 5" fill="#ffd700"/>
                </svg>
                <div class="progress-bar" id="user1-progress"><div class="progress-fill" style="width: 0%;"></div></div>
            </div>
            <div class="car" id="user2-car">
                <svg viewBox="0 0 100 50">
                    <rect x="10" y="20" width="80" height="20" fill="#00f7ff" rx="5"/>
                    <circle cx="25" cy="40" r="8" fill="#111827"/>
                    <circle cx="75" cy="40" r="8" fill="#111827"/>
                    <rect x="30" y="10" width="40" height="10" fill="#99faff" rx="3"/>
                    <path d="M90 30 l10 5 l-10 5" fill="#ffd700"/>
                </svg>
                <div class="progress-bar" id="user2-progress"><div class="progress-fill" style="width: 0%;"></div></div>
            </div>
        </div>
        <textarea id="userInput" placeholder="Type here to race! 🏎️" aria-label="Typing input" disabled></textarea>
        <div class="button-group">
            <button onclick="startRace()">Start🏎️</button>
            <button onclick="resetRace()">Reset 🔄</button>
        </div>
        <div class="results">
            <p id="wpm">WPM: 0</p>
            <p id="accuracy">Accuracy: 0%</p>
            <p id="report">Report: Start typing to see analysis.</p>
        </div>
    </div>
        
    </main>

    <footer>
        
        <p>© 2025 Typing Coach AI</p>
    </footer>

   <script src="competition-typing/script.js"></script>
</body>
</html>
