<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for Typing Coach AI to master typing with fun games, tests, and expert tips.">
    <meta name="keywords" content="typing coach, signup, typing practice, typing games, learn typing">
    <title>Typing Coach AI - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Tailwind Overrides */
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #f472b6;
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2);
        }
        .error-message {
            display: none;
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .error .error-message {
            display: block;
        }
        .error input {
            border-color: #ef4444;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #f472b6;
            color: #fff;
            padding: 8px;
            z-index: 1000;
        }
        .skip-link:focus {
            top: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-pink-50 dark:bg-gradient-to-br dark:from-gray-900 dark:to-gray-800 text-gray-900 dark:text-gray-100 font-inter min-h-screen flex flex-col">
    <noscript>
        <div class="text-center p-4 bg-pink-500 text-white">
            JavaScript is disabled. Please enable it to sign up for Typing Coach AI.
        </div>
    </noscript>
    <a href="#main" class="skip-link">Skip to Content</a>
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
         <div class="logo flex items-center space-x-2">
            <img src="assests/images/logo.png" alt="Typing Coach AI Logo" class="h-8 w-8" loading="lazy" onerror="this.style.display='none'">
            <span class="text-2xl font-bold tracking-tight">Typing Coach AI</span>
        </div>
        <nav class="flex items-center space-x-6">
            <a href="index.html" class="hover:text-pink-400 transition-colors" aria-label="Go to Home">Home</a>
           
        </nav>
    </header>

    <main id="main" class="flex-1 flex items-center justify-center p-6">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-8 shadow-lg max-w-md w-full animate-[slideIn_0.5s_ease-in]">
            <h1 class="text-3xl font-bold text-blue-900 dark:text-blue-300 mb-6 text-center">Sign Up</h1>
            <form id="signupForm" class="space-y-4" onsubmit="handleSubmit(event)">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        maxlength="20"
                        class="input-focus mt-1 w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none"
                        aria-describedby="username-error"
                    >
                    <p id="username-error" class="error-message">Username must be 3-20 characters long.</p>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="input-focus mt-1 w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none"
                        aria-describedby="email-error"
                    >
                    <p id="email-error" class="error-message">Please enter a valid email address.</p>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        class="input-focus mt-1 w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none"
                        aria-describedby="password-error"
                    >
                    <p id="password-error" class="error-message">Password must be at least 8 characters long.</p>
                </div>
                <div class="flex items-center">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        class="h-4 w-4 text-pink-500 focus:ring-pink-500 border-gray-300 rounded"
                        aria-describedby="terms-error"
                    >
                    <label for="terms" class="ml-2 text-sm text-gray-700 dark:text-gray-300">
                        I agree to the <a href="terms.html" class="text-pink-500 hover:text-pink-600">Terms of Service</a> and <a href="privacy.html" class="text-pink-500 hover:text-pink-600">Privacy Policy</a>.
                    </label>
                </div>
                <p id="terms-error" class="error-message">You must agree to the terms to sign up.</p>
                <button
                    type="submit"
                    class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-4 rounded-lg transition-all flex items-center justify-center"
                    id="submitButton"
                >
                    Sign Up
                </button>
            </form>
           
        </div>
    </main>

    <footer class="bg-blue-900 text-white p-6 text-center">
        <p>© 2025 Typing Coach AI</p>
        
    </footer>

    <script>
       
        // Form Validation and Submission
        function handleSubmit(event) {
            event.preventDefault();
            const form = document.getElementById('signupForm');
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const terms = document.getElementById('terms');
            const submitButton = document.getElementById('submitButton');
            let isValid = true;

            // Reset error states
            [username, email, password, terms].forEach(field => {
                field.parentElement.classList.remove('error');
            });

            // Username validation
            if (username.value.length < 3 || username.value.length > 20) {
                username.parentElement.classList.add('error');
                isValid = false;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                email.parentElement.classList.add('error');
                isValid = false;
            }

            // Password validation
            if (password.value.length < 8) {
                password.parentElement.classList.add('error');
                isValid = false;
            }

            // Terms validation
            if (!terms.checked) {
                terms.parentElement.classList.add('error');
                isValid = false;
            }

            if (isValid) {
                submitButton.disabled = true;
                submitButton.innerHTML = 'Signing Up... <i class="fas fa-spinner fa-spin ml-2"></i>';
                // Simulate API call
                setTimeout(() => {
                    // Store user data in localStorage (for demo purposes)
                    localStorage.setItem('user', JSON.stringify({
                        username: username.value,
                        email: email.value
                    }));
                    // Redirect to game menu
                    window.location.href = 'home.html';
                }, 1500);
            }
        }
    </script>
