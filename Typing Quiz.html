<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Coach AI - Typing Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
   <link href="Typing Quiz/quiz.css" rel="stylesheet">
</head>
<body>
    <noscript>
        <div style="text-align: center; padding: 1rem; background: #f472b6; color: #fff;">
            JavaScript is disabled. Please enable it to use all features of Typing Coach AI.
        </div>
    </noscript>
     <a href="#main" class="skip-link">Skip to Content</a>
    <header>
        <div class="logo"> Typing Coach AI</div>
         <nav id="nav-menu">
            <a href="home.html" aria-label="Go to Home">Home</a>
        </nav>
    </header>
    <main id="main">
       <div id="container">
        <h1>Quiz-Style Typing</h1>
        <div id="question-display"></div>
        <input type="text" id="input-field" placeholder="Type the text here..." autocomplete="off">
        <div id="stats">
            <span id="question-count">Question: 1/10</span>
            <span id="wpm">WPM: 0</span>
            <span id="accuracy">Accuracy: 100%</span>
        </div>
        <div id="feedback"></div>
        <button id="start-next-btn">Start</button>
    </div>
    </main>
    <footer>
        <p>© 2025 Typing Coach AI</p>
    </footer>
     <script src="Typing Quiz/quiz.js"></script>
</body>
</html>
