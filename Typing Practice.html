<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
	 <link href="Typing Practice/style-typing-practice.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
  
    </style>
</head>
<body>
    <noscript>
        <div style="text-align: center; padding: 1rem; background: #f472b6; color: #fff;">
            JavaScript is disabled. Please enable it to use all features of Typing Coach AI.
        </div>
    </noscript>
    <a href="#main" class="skip-link">Skip to Content</a>
    <header>
        <div class="logo">Typing Coach AI</div>
        <button class="hamburger" aria-label="Toggle navigation" onclick="toggleNav()">☰</button>
        <nav id="nav-menu">
            <a href="home.html" aria-label="Go to Home">Home</a>
        </nav>
    </header>

    <main id="main">
        
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
       <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">Typing Practice</h1>
    
    <div class="setup">
      <input type="text" id="playerName" placeholder="Enter your name" class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />
      <button onclick="startChallenge()" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition duration-300">Join Challenge</button>
    </div>

    <div id="challengeArea" class="hidden">
      <p class="text-center text-xl font-semibold text-gray-700 mb-4">
        <strong>Get Ready:</strong> <span id="countdown" class="text-3xl text-indigo-600 animate-pulse-slow">3</span>
      </p>
      <div class="w-full h-2 bg-gray-200 rounded-full mb-4">
        <div id="countdownProgress" class="h-full bg-indigo-600 rounded-full progress-bar" style="width: 100%"></div>
      </div>
      <div class="quote bg-gray-100 p-6 rounded-lg mb-4 text-lg text-gray-800 leading-relaxed" id="quoteDisplay"></div>
      <textarea id="quoteInput" placeholder="Start typing after countdown..." class="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" disabled></textarea>

      <div class="results grid grid-cols-3 gap-4 mt-4 text-center">
        <div>
          <p class="font-semibold text-gray-600">Time</p>
          <p id="time" class="text-xl text-indigo-600">0s</p>
        </div>
        <div>
          <p class="font-semibold text-gray-600">WPM</p>
          <p id="wpm" class="text-xl text-indigo-600">0</p>
        </div>
        <div>
          <p class="font-semibold text-gray-600">Accuracy</p>
          <p id="accuracy" class="text-xl text-indigo-600">100%</p>
        </div>
      </div>

      <div class="final-result hidden mt-6 p-4 bg-indigo-50 rounded-lg text-gray-800" id="finalResult"></div>
      <button onclick="restart()" class="w-full mt-4 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition duration-300">Play Again</button>
    </div>
  </div>
        
    </main>

    <footer>
        
        <p>© 2025 Typing Coach AI</p>
    </footer>
 <script src="Typing Practice/script.js"></script>
</body>
</html>
